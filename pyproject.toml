[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "lobpy"
version = "0.6.0"
description = "Python research layer for the lob C++ order book engine: backtester, features and models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Max Sloam" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "scikit-learn>=1.4", "lightgbm>=4.3"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
cmake.build-type = "Release"
wheel.packages = ["python/lobpy"]

# pip builds only the library and the extension module, not the tests, tools or benchmarks.
[tool.scikit-build.cmake.define]
LOB_BUILD_PYTHON = "ON"
LOB_BUILD_TESTS = "OFF"
LOB_BUILD_TOOLS = "OFF"
LOB_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
